id: "rubric:default-generic"
title: Default Performance Rubric
description: "General-purpose rubric for evaluating learner work across any subject."
type: holistic
agentAutomatable: false
requiresHumanReview: true
criteria:
  - id: overall-performance
    name: Overall Performance
    description: "Holistic assessment of learner work against stated objectives."
    levels:
      - level: Exceeds
        description: "Learner surpasses the objective with insight and transferability."
        points: 100
      - level: Meets
        description: "Learner meets the objective with clear evidence of understanding."
        points: 80
      - level: Approaches
        description: "Learner demonstrates partial understanding; follow-up required."
        points: 60
      - level: Does Not Meet
        description: "Learner does not demonstrate the objective; substantial support needed."
        points: 40
